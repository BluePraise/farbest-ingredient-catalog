name: Deploy Plugin to SiteGround

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: gvam1152.siteground.biz
          REMOTE_PORT: 18765
          REMOTE_USER: u2827-g9lpwz7hodtd
          REMOTE_PATH: /home/customer/www/farbest-classic.navesinkwebsolutions.com/public_html/wp-content/plugins/farbest-product-catalog
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p $REMOTE_PORT $REMOTE_HOST >> ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $REMOTE_PORT" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='assets/src' \
            --exclude='.DS_Store' \
            ./ $REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH
